name: Sync Novel to Database

on:
  push:
    branches: [main]
    paths:
      - 'main/**/*.md'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout novel repository
        uses: actions/checkout@v4
        with:
          path: novel
          fetch-depth: 0

      - name: Checkout platform repository
        uses: actions/checkout@v4
        with:
          repository: RollieGarcia0031/psychic-petals-platform
          path: platform

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: platform/backend
        run: npm ci

      - name: Find changed chapter files
        id: changed
        working-directory: novel
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = '0000000000000000000000000000000000000000' ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED=$(git ls-files -- 'main/**/*.md')
          else
            # Deleted paths cannot be read by the sync script. Renames are
            # included as additions, so their destination path is synced.
            CHANGED=$(git diff --diff-filter=ACMR --name-only "$BEFORE" "$SHA" -- 'main/**/*.md')
          fi
          CHANGED=$(printf '%s' "$CHANGED" | paste -sd, -)
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Find deleted chapter files
        id: deleted
        working-directory: novel
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = '0000000000000000000000000000000000000000' ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            DELETED=""
          else
            DELETED=$(git diff --diff-filter=D --name-only "$BEFORE" "$SHA" -- 'main/**/*.md')
          fi
          DELETED=$(printf '%s' "$DELETED" | paste -sd, -)
          echo "files=$DELETED" >> "$GITHUB_OUTPUT"

      - name: Split chapter files by language
        id: split
        working-directory: novel
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          DELETED_FILES: ${{ steps.deleted.outputs.files }}
        run: |
          # Bucket paths the same way the backend's parseChapterPath/
          # resolveNovelId route them: main/<lang>/... targets
          # novels/psychic_petals_<lang> (en targets the base novel), while
          # legacy bare paths (main/episode-NN/...) belong to the base English
          # novel. Each group is synced independently below so one language
          # failing or being empty never blocks the others.
          split_list() {
            local target="$1" list="$2"
            printf '%s' "$list" | tr ',' '\n' | awk -v target="$target" '
              $0 == "" { next }
              {
                if ($0 ~ /^main\/[a-z][a-z]\//) {
                  lang = substr($0, 6, 2)
                  if (lang == target || (target == "other" && lang != "en" && lang != "tl"))
                    print
                } else if (target == "en") {
                  print
                }
              }
            ' | paste -sd, -
          }
          echo "changed_en=$(split_list en "$CHANGED_FILES")" >> "$GITHUB_OUTPUT"
          echo "changed_tl=$(split_list tl "$CHANGED_FILES")" >> "$GITHUB_OUTPUT"
          echo "changed_other=$(split_list other "$CHANGED_FILES")" >> "$GITHUB_OUTPUT"
          echo "deleted_en=$(split_list en "$DELETED_FILES")" >> "$GITHUB_OUTPUT"
          echo "deleted_tl=$(split_list tl "$DELETED_FILES")" >> "$GITHUB_OUTPUT"
          echo "deleted_other=$(split_list other "$DELETED_FILES")" >> "$GITHUB_OUTPUT"

      - name: Sync English chapters to Firestore
        working-directory: platform/backend
        if: ${{ steps.split.outputs.changed_en != '' || steps.split.outputs.deleted_en != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          CHANGED_FILES: ${{ steps.split.outputs.changed_en }}
          DELETED_FILES: ${{ steps.split.outputs.deleted_en }}
        run: node scripts/sync-novel.js --novel-dir ../../novel --changed "$CHANGED_FILES" --deleted "$DELETED_FILES"

      - name: Sync Tagalog chapters to Firestore
        working-directory: platform/backend
        if: ${{ steps.split.outputs.changed_tl != '' || steps.split.outputs.deleted_tl != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          CHANGED_FILES: ${{ steps.split.outputs.changed_tl }}
          DELETED_FILES: ${{ steps.split.outputs.deleted_tl }}
        run: node scripts/sync-novel.js --novel-dir ../../novel --changed "$CHANGED_FILES" --deleted "$DELETED_FILES"

      - name: Sync other language chapters to Firestore
        working-directory: platform/backend
        if: ${{ steps.split.outputs.changed_other != '' || steps.split.outputs.deleted_other != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          CHANGED_FILES: ${{ steps.split.outputs.changed_other }}
          DELETED_FILES: ${{ steps.split.outputs.deleted_other }}
        run: node scripts/sync-novel.js --novel-dir ../../novel --changed "$CHANGED_FILES" --deleted "$DELETED_FILES"
